
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dirga | Personal Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tombol Dark Mode -->
    <button id="theme-button" class="theme-button">
        🌙 Dark Mode
    </button>

    <!-- Kartu Profil -->
    <main class="profile-card">

        <div class="badge">Beginner Developer</div>

        <!-- Foto Profil -->
        <div class="avatar">
            <img src="./images/profile.jpeg" alt="Foto profil Dirga">
        </div>

        <!-- Nama -->
        <h1>Dirga</h1>

        <!-- Animasi Typing -->
        <p class="role">
            <span id="typing-text"></span><span class="cursor">|</span>
        </p>

        <!-- Deskripsi -->
        <p class="description">
            Halo! Saya sedang belajar HTML, CSS, Git, dan GitHub.
            Saya ingin menjadi developer yang hebat.
        </p>

        <!-- Hobi -->
        <h2>Hobi Saya</h2>

        <div class="hobbies">
            <span>💻 Coding</span>
            <span>🎮 Gaming</span>
            <span>🎧 Music</span>
        </div>

        <!-- Tombol Kontak -->
        <a href="mailto:emailkamu@example.com" class="contact-button">
            Hubungi Saya
        </a>

        <!-- Tombol Sapaan -->
        <button id="greet-button" class="greet-button">
            Sapa Saya 👋
        </button>

        <!-- Footer -->
        <p class="footer">
            Made with ❤️ by Dirga
        </p>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
