
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dirga | Personal Profile</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tombol Dark Mode -->
    <button id="theme-button">
        🌙 Dark Mode
    </button>

    <!-- Kartu Profil -->
    <main class="profile-card">

        <!-- Badge -->
        <div class="badge">
            Beginner Developer
        </div>

        <!-- Avatar -->
        <div class="avatar">
           <img src="./images/profile.jpg" alt="Foto profil Dirga">
        </div>

        <!-- Nama -->
        <h1>Dirga</h1>

        <!-- Profesi -->
        <p class="role">
            Future Web Developer 🚀
        </p>

        <!-- Deskripsi -->
        <p class="description">
            Halo! Saya sedang belajar HTML, CSS,
            Git, dan GitHub. Saya ingin menjadi
            developer yang hebat.
        </p>

        <!-- Hobi -->
        <h2>Hobi Saya</h2>

        <div class="hobbies">
            <span>💻 Coding</span>
            <span>🎮 Gaming</span>
            <span>🎧 Music</span>
        </div>

        <!-- Tombol Kontak -->
        <a href="mailto:emailkamu@example.com"
           class="contact-button">
            Hubungi Saya
        </a>

        <!-- Tombol Sapaan -->
        <button id="greet-button"
                class="greet-button">
            Sapa Saya 👋
        </button>

        <!-- Footer -->
        <p class="footer">
            Made with ❤️ by Dirga
        </p>

    </main>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
