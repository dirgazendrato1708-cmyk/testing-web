
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dirga | Personal Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tombol untuk mengganti tema -->
    <button id="theme-button" class="theme-button">
        ☀️ Light Mode
    </button>

    <!-- Kartu profil utama -->
    <main class="profile-card">

        <div class="badge">Beginner Developer</div>

        <!-- Foto profil -->
        <div class="avatar">
            <img src="./images/profile.jpeg" alt="Foto profil Dirga">
        </div>

        <h1>Dirga</h1>

        <p class="role">
           <span id="typing-text"></span><span class="cursor">|</span>
        </p>        

        <p class="description">
            Halo! Saya sedang belajar HTML, CSS, Git, dan GitHub.
            Saya ingin menjadi developer yang hebat.
        </p>

        <!-- Bagian hobi -->
        <h2>Hobi Saya</h2>

        <div class="hobbies">
            <span>💻 Coding</span>
            <span>🎮 Gaming</span>
            <span>🎧 Music</span>
        </div>

        <!-- Tombol kontak -->
        <a href="mailto:emailkamu@example.com" class="contact-button">
            Hubungi Saya
        </a>

        <!-- Tombol JavaScript -->
        <button id="greet-button" class="greet-button">
            Sapa Saya 👋
        </button>

        <p class="footer">
            Made with ❤️ by Dirga
        </p>

    </main>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
